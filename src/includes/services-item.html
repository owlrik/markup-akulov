<div class="services-item services-table__item">
  <div class="services-item__name-wrap">
    <p class="services-item__name">
      @@serviceName
    </p>
  </div>

  <div class="services-item__price-wrap">
    <a class="btn --dark services-item__btn" href="#">Записаться</a>

    <div class="services-item__prices">
      <p class="services-item__price-new"><span>@@servicePriceNew</span> ₽</p>
      @@if (context.servicePriceOld) {
        <p class="services-item__price-old"><span>@@servicePriceOld</span> ₽</p>
      }
    </div>
  </div>
</div>
